services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_API_MODE: ${VITE_API_MODE:-production}
        VITE_ENDPOINT_BACKEND_LOCAL: ${VITE_ENDPOINT_BACKEND_LOCAL:-/api}
        VITE_ENDPOINT_BACKEND_PRODUCTION: ${VITE_ENDPOINT_BACKEND_PRODUCTION:-/api}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
